
name: FreshMart CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "argocd-practice/freshmart/site/**"
      - ".github/workflows/docker-build-push.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./argocd-practice/freshmart/site
          push: true
          tags: sharikm/freshmart-storefront:${{ steps.vars.outputs.tag }}

      - name: Update Kubernetes deployment
        run: |
          sed -i "s|image: sharikm/freshmart-storefront:.*|image: sharikm/freshmart-storefront:${{ steps.vars.outputs.tag }}|" argocd-practice/freshmart/deployment.yaml

      - name: Commit and push updated YAML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argocd-practice/freshmart/deployment.yaml
          git commit -m "Update FreshMart image to ${{ steps.vars.outputs.tag }}" || echo "No changes"
          git push
