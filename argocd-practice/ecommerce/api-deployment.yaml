
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      containers:
        - name: ecommerce-api
          image: 70madmax07/ecommerce-api:latest
          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: NODE_ENV
              value: "production"

            - name: MONGO_URI
              value: "mongodb://mongodb-service:27017/ecommerce"

            - name: REDIS_URL
              value: "redis://redis-service:6379"

            - name: CLIENT_URL
              value: "http://100.73.198.115:30003"

            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-jwt
                  key: JWT_ACCESS_SECRET

            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-jwt
                  key: JWT_REFRESH_SECRET

            - name: JWT_ACCESS_EXPIRES
              value: "15m"

            - name: JWT_REFRESH_EXPIRES
              value: "7d"

