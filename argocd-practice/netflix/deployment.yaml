apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: netflix
          image: owarsame/netflix:latest
          ports:
            - containerPort: 80
