
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-shop
  template:
    metadata:
      labels:
        app: online-shop
    spec:
      containers:
        - name: online-shop
          image: amitabhdevops/online_shop:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: online-shop-service
spec:
  type: NodePort
  selector:
    app: online-shop
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30094
